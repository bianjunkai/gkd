[project]
name = "gkd-api"
version = "0.1.0"
description = "A Markdown-first GTD workspace"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0.36,<3",
  "PyYAML>=6.0.3,<7",
  "httpx>=0.28,<1",
  "tzdata>=2025.1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["B008"]
